# FlowHub 一键部署：PostgreSQL + Redis + MinIO + Backend（内置 opencode）
# 使用：docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowhub
      POSTGRES_PASSWORD: flowhub
      POSTGRES_DB: flowhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowhub -d flowhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flowhub
      MINIO_ROOT_PASSWORD: flowhub-minio
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      # MCP JSON / Skill 下载中使用的浏览器可访问地址。生产环境请在
      # deploy/.env 中显式覆盖为正式域名或网关地址。
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Agent API Key 加密密钥（建议设置固定值；变更会导致已存 Key 无法解密）
      AGENT_KEY_ENCRYPT_SECRET: ${AGENT_KEY_ENCRYPT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5273,http://localhost:5173}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: flowhub
      POSTGRES_PASSWORD: flowhub
      POSTGRES_DB: flowhub
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: flowhub
      MINIO_SECRET_KEY: flowhub-minio
      BOOTSTRAP_ADMIN_ACCOUNT: ${BOOTSTRAP_ADMIN_ACCOUNT:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-系统管理员}
      # opencode 执行超时（秒）
      OPENCODE_TIMEOUT: ${OPENCODE_TIMEOUT:-180}
      # 仓库镜像根目录：与 repomirror 卷挂载点一致
      REPO_MIRROR_ROOT: /app/.repo-mirror
    volumes:
      # 仓库镜像缓存：容器重建后不重 clone（backend/.repo-mirror）
      - repomirror:/app/.repo-mirror
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  repomirror:
