[project]
name = "flowhub-backend"
version = "0.1.0"
description = "FlowHub backend API（前后端分离 · flowhub/backend）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "greenlet>=3.0,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "redis>=5.0,<6.0",
  "minio>=7.2,<8.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "cryptography>=42,<51",
  "bcrypt>=4.0,<5.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.1,<3.0",
  "httpx>=0.27,<1.0",
  "mcp>=1.0,<2.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  "langchain-openai>=0.3,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowhub_api"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
